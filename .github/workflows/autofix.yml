name: "Bug auto-fix"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to fix (0 = pick the oldest eligible issue)"
        default: '0'
      dry_run:
        description: "Print the writes instead of doing them"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: autofix
  cancel-in-progress: false

env:
  AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL || 'claude-opus-5-5' }}
  AUTOFIX_BUDGET_USD: ${{ vars.AUTOFIX_BUDGET_USD || '5' }}
  AUTOFIX_MAX_CHANGED_LINES: ${{ vars.AUTOFIX_MAX_CHANGED_LINES || '300' }}
  AUTOFIX_MAX_RUNS: ${{ vars.AUTOFIX_MAX_RUNS || '0' }}
  AUTOFIX_HANDOVER_TO: ${{ vars.AUTOFIX_HANDOVER_TO }}
  AUTOFIX_ISSUE: ${{ inputs.issue || '0' }}
  AUTOFIX_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  select:
    name: Select work
    if: github.event_name != 'issues' || github.event.label.name == 'claude-autofix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      hasBug: ${{ steps.pick.outputs.hasBug }}
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick an issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/autofix/pick-bug.mjs
      - name: Upload selection
        if: steps.pick.outputs.hasBug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autofix-select
          path: autofix-output
          include-hidden-files: true

  fix:
    name: Reproduce and fix with Claude
    needs: select
    if: needs.select.outputs.hasBug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare the Claude Code sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc true && echo "bubblewrap works"
      - name: Install Claude Code
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@latest
      - name: Download the selection
        uses: actions/download-artifact@v4
        with:
          name: autofix-select
          path: autofix-output
      - name: Reproduce and fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_PACKAGE_DIR: ${{ runner.temp }}/claude-cli/node_modules/@anthropic-ai/claude-code
        run: node scripts/autofix/run-fix.mjs
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: autofix-fix
          path: autofix-output
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    name: Open pull request or hand over
    needs: [select, fix]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.hasBug == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the fix
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: autofix-fix
          path: ${{ runner.temp }}/autofix-fix
      - name: Download the selection
        uses: actions/download-artifact@v4
        with:
          name: autofix-select
          path: ${{ runner.temp }}/autofix-select
      - name: Merge the artifacts
        run: |
          mkdir -p autofix-output
          cp -R "$RUNNER_TEMP/autofix-fix/." autofix-output/ || true
          cp -R "$RUNNER_TEMP/autofix-select/." autofix-output/
      - name: Post test cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/autofix/create-test-cases.mjs
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN || github.token }}
          HAS_AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN != '' }}
        run: node scripts/autofix/open-pr.mjs
      - name: Hand over to a person
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN || github.token }}
        run: node scripts/autofix/handover.mjs
      - name: Upload the final output
        uses: actions/upload-artifact@v4
        with:
          name: claude-autofix
          path: autofix-output
          include-hidden-files: true
